appId: com.omnidoc.studio
productName: OmniDoc Studio
directories:
  output: dist-electron
  buildResources: build

files:
  - out/**/*
  - package.json

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Office

publish:
  provider: github
  owner: omnidoc
  repo: omnidoc-studio
